# cargo deny check  (CI runs advisories, bans, licenses, sources)

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no vulnerability and no drop-in replacement yet" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (transitive via ratatui); compile-time only" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]
# MPL-2.0 is file-level copyleft: fine to link; only changes to those crates' own files would need sharing.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]
confidence-threshold = 0.9

[licenses.private]
# rlg itself has no licence field; publish = false marks it private.
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
